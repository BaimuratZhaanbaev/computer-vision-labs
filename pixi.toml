[workspace]
authors = ["Baika <bajmuratzaanbaev@gmail.com>"]
channels = ["conda-forge"]
name = "computer-vision-labs"
platforms = ["win-64", "linux-64", "osx-64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab"

[dependencies]
python = "3.12.*"
jupyterlab = ">=4.6.4,<5"
pixi-kernel = ">=0.7.1,<0.8"
opencv = ">=5.0.0,<6"
matplotlib = ">=3.11.2,<4"
numpy = ">=2.5.4,<3"
rich = ">=15.0.0,<16"
pandas = ">=3.1.0,<4"
dvc = ">=3.67.1,<4"
dvc-gdrive = ">=3.0.1,<4"
dvc-s3 = ">=3.3.0,<4"
awscli = ">=2.38.1,<3"
huggingface_hub = ">=2.3.0,<3"

[pypi-dependencies]
jupyterlab-gruvbox-material = ">=2.0.0, <3"
